name: Find Existing v5.9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-v59:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find existing v5.9 implementation
        run: |
          echo ""
          echo "=========================================="
          echo "1. REPOSITORY FILE TREE"
          echo "=========================================="
          find . \
            -type f \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "=========================================="
          echo "2. PYTHON FILES"
          echo "=========================================="
          find . \
            -type f \
            -name "*.py" \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "=========================================="
          echo "3. WORKFLOW FILES"
          echo "=========================================="
          find .github/workflows \
            -type f \
            2>/dev/null \
            | sort || true

          echo ""
          echo "=========================================="
          echo "4. v5.9 REFERENCES"
          echo "=========================================="
          grep -RniE \
            "v5[.]9|v59|Prediction Engine" \
            . \
            --exclude-dir=.git \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "5. PREDICTION REFERENCES"
          echo "=========================================="
          grep -RniE \
            "prediction|急騰|ストップ高|STOP高|candidate|screening" \
            . \
            --include="*.py" \
            --include="*.yml" \
            --include="*.yaml" \
            --exclude-dir=.git \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "6. NOTE PUBLISH REFERENCES"
          echo "=========================================="
          grep -RniE \
            "note.com|text_notes|NOTE_COOKIE|publish.py" \
            . \
            --include="*.py" \
            --include="*.yml" \
            --include="*.yaml" \
            --exclude-dir=.git \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "SEARCH COMPLETE"
          echo "=========================================="
