name: v5.9 Prediction to note

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests Pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      # 既存のv5.9本体を実行
      - name: Run Prediction Engine v5.9
        run: |
          python prediction/v59.py

      # v5.9結果をそのまま記事化
      - name: Create note article
        run: |
          python article/create_article.py

      - name: Create eyecatch
        run: |
          python article/create_eyecatch.py

      - name: Publish to note
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
        run: |
          python note/publish.py

      - name: Save publication marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/published/

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record v5.9 note publication"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
