name: Publish v5.9 Article to note

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Publish completed v5.9 article to note
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
          DRY_RUN: "false"
        run: |
          python publish.py

      - name: Save publication result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/published/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No publication marker to commit."
            exit 0
          fi

          git commit -m "Record note publication"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
