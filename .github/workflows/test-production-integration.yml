name: Test production integration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-integration-test
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Generate eyecatch
        env:
          PREDICTION_JSON: "data/prediction/integration_v511_01.json"
        run: python article/create_eyecatch.py

      - name: Publish integration test
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
          DRY_RUN: "false"
          PREDICTION_JSON: "data/prediction/integration_v511_01.json"
        run: python note/publish.py
        
      - name: Persist publication marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/published/

          if git diff --cached --quiet; then
            echo "No publication marker to commit"
            exit 0
          fi

          git commit -m "Record published Prediction ID"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
