name: Test production integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: note-integration-test
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Generate eyecatch
        env:
          PREDICTION_JSON: "data/prediction/integration_v511_01.json"
        run: python article/create_eyecatch.py

      - name: Publish integration test
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
          DRY_RUN: "false"
          PREDICTION_JSON: "data/prediction/integration_v511_01.json"
        run: python note/publish.py
