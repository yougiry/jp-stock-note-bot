name: Test eyecatch generation

on:
  workflow_dispatch:

jobs:
  eyecatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow
        
      - name: Diagnose Japanese fonts
        run: |
          echo "===== OS ====="
          cat /etc/os-release

          echo "===== PACKAGE ====="
          dpkg -l | grep -E "fonts-noto|noto" || true

          echo "===== FONTCONFIG JAPANESE ====="
          fc-list :lang=ja family file | head -50 || true

          echo "===== NOTO FILES ====="
          find /usr/share/fonts -type f | grep -i noto | head -100 || true

          echo "===== ALL FONT DIRECTORIES ====="
          find /usr/share/fonts -maxdepth 4 -type f | head -100
          
      - name: Generate eyecatch
        run: python article/create_eyecatch.py

      - name: Verify generated file
        run: |
          test -f output/eyecatch.png
          file output/eyecatch.png

      - name: Upload eyecatch artifact
        uses: actions/upload-artifact@v4
        with:
          name: v511-eyecatch
          path: output/eyecatch.png
