name: Test note eyecatch

on:
  workflow_dispatch:

jobs:
  test-eyecatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f -v

      - name: Verify Japanese fonts
        run: |
          echo "===== Japanese fonts ====="
          fc-list :lang=ja family file | head -20 || true
          echo "===== Noto files ====="
          find /usr/share/fonts -type f | grep -i noto | head -50 || true

      - name: Generate 1280x670 eyecatch
        run: python article/create_eyecatch.py

      - name: Verify eyecatch
        run: |
          test -f output/eyecatch.png
          file output/eyecatch.png

      - name: Upload eyecatch to note
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
        run: python note/test_eyecatch_upload.py
