name: Build v5.11 Price History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v511-price-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests
          
      - name: Build price history
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python prediction/build_price_history.py

      - name: Calculate v5.11 price factors
        run: |
          python prediction/calculate_price_factors.py

      - name: Install JPX universe dependencies
        run: |
          pip install pandas openpyxl xlrd beautifulsoup4

      - name: Build v5.11 universe features
        run: |
          python prediction/build_universe_features.py

      - name: Persist price history

      - name: Persist price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market/jquants/

          if git diff --cached --quiet; then
            echo "No new market data."
            exit 0
          fi

          git commit -m "Add J-Quants historical market data"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
