name: Test v5.11 to note

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  v511-note:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Generate v5.11 article and save note draft
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
        run: python note/publish_draft.py
      - name: Save publication marker
        run: |
          if [ -n "$(git status --porcelain data/published/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/published/
            git commit -m "Record published prediction"

            git push
          else
            echo "No new publication marker"
          fi
