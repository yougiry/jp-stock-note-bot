name: Test note draft creation

on:
  workflow_dispatch:

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Create test note draft
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
        run: python note/test_create_draft.py
